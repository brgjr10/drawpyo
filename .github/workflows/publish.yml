name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'electron/**'
      - 'dist-electron/**'
      - 'assets/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    steps: # FIXED: Aligned properly with runs-on
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com' # FIXED: Changed back to the package registry URL
          scope: '@brgjr10'

      # Falls back to regular install to bypass the lockfile sync error
      - run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
