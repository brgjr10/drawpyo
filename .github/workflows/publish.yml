name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'electron/**'
      - 'dist-electron/**'
      - 'assets/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
